name: 001az

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  extractor:
    build: ./extractor
    restart: unless-stopped
    environment:
      # needs a real default: the sidecar does int() on it, empty would crash
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-20}

  transcriber:
    build:
      context: ./transcriber
      args:
        # one knob bakes AND serves the model — see transcriber/Dockerfile.
        # changing it needs a rebuild (baked model), so it's build-time, not UI.
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_BEAM: ${WHISPER_BEAM:-5}

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gallery}:${POSTGRES_PASSWORD:-gallery}@db:5432/${POSTGRES_DB:-gallery}
      BASE_URL: ${BASE_URL:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL: ${MODEL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-90}
      # judgment history (tag_snapshots) — deduped upstream, so 0 = keep forever
      TAG_SNAPSHOT_RETENTION_DAYS: ${TAG_SNAPSHOT_RETENTION_DAYS:-0}
      EXTRACTOR_URL: http://extractor:3002
      TRANSCRIBER_URL: http://transcriber:3003
      # names the sidecar's baked model so the app can stamp the transcript
      # cache with it (same ${WHISPER_MODEL} as the transcriber → no drift)
      TRANSCRIBER_MODEL: ${WHISPER_MODEL:-base}
      # outbound tuning — code owns the defaults (empty passes through safely);
      # set in .env only when a provider's pace or latency demands it
      CONNECTOR_RPM: ${CONNECTOR_RPM:-}
      CONNECTOR_BURST: ${CONNECTOR_BURST:-}
      CONNECTOR_TIMEOUT_MS: ${CONNECTOR_TIMEOUT_MS:-}
      CONNECTOR_RETRY_CAP_MS: ${CONNECTOR_RETRY_CAP_MS:-}
      AI_CHAT_TIMEOUT_MS: ${AI_CHAT_TIMEOUT_MS:-}
      AI_EMBED_TIMEOUT_MS: ${AI_EMBED_TIMEOUT_MS:-}
      EXTRACTOR_TIMEOUT_MS: ${EXTRACTOR_TIMEOUT_MS:-}
      TRANSCRIBER_TIMEOUT_MS: ${TRANSCRIBER_TIMEOUT_MS:-}
      # automatic ingestion: watched folders live under this root (bind-mounted
      # below — drop files into ./ingest-root on the host). The tunables are
      # code-owned defaults; set in .env only to deviate.
      INGEST_ROOT: /data/ingest
      INGEST_CONTINUOUS_MS: ${INGEST_CONTINUOUS_MS:-}
      INGEST_SETTLE_MS: ${INGEST_SETTLE_MS:-}
      INGEST_RUN_CAP: ${INGEST_RUN_CAP:-}
      INGEST_FEED_CACHE_MS: ${INGEST_FEED_CACHE_MS:-}
      # scheduled auto-tagging (weekend detection, run times) uses server-local time
      TZ: ${TZ:-UTC}
    volumes:
      - appdata:/data
      - ./ingest-root:/data/ingest
    depends_on:
      db:
        condition: service_healthy
      extractor:
        condition: service_started
      transcriber:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gallery}
      POSTGRES_DB: ${POSTGRES_DB:-gallery}
    ports:
      # host access for dev tooling (mintlink from the host, the sqlite ETL)
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gallery} -d $${POSTGRES_DB:-gallery}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- optional local sources for exercising remote ingestion (FTP / S3) ---
  # Opt-in only — a plain `up` never starts these (they carry a profile), so
  # prod is untouched. Bring them up for testing with:
  #   docker compose --profile dev-sources up -d ftp minio
  # then add an FTP / S3 connection on the Plugins page pointing at:
  #   FTP  host=ftp  user=gallery pass=gallery  (or 127.0.0.1:21 from the host)
  #   S3   endpoint=http://minio:9000  bucket=<make one>  key/secret=gallery/gallerysecret  path-style=on
  ftp:
    image: stilliard/pure-ftpd
    profiles: ["dev-sources"]
    restart: unless-stopped
    environment:
      FTP_USER_NAME: gallery
      FTP_USER_PASS: gallery
      FTP_USER_HOME: /home/ftpusers/gallery
      PUBLICHOST: 127.0.0.1
    ports:
      - "127.0.0.1:21:21"
      - "127.0.0.1:30000-30009:30000-30009"
    volumes:
      # serve the same tree the local folder source watches, for easy comparison
      - ./ingest-root:/home/ftpusers/gallery

  minio:
    image: minio/minio
    profiles: ["dev-sources"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gallery
      MINIO_ROOT_PASSWORD: gallerysecret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
  miniodata:

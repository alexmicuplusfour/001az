# docker compose up -d  ->  http://localhost:8001

name: 001az

services:
  app:
    image: ghcr.io/alexmicuplusfour/001az-app:latest
    build: .
    restart: unless-stopped
    ports:
      - "8001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gallery}:${POSTGRES_PASSWORD:-gallery}@db:5432/${POSTGRES_DB:-gallery}
      INGEST_ROOT: /data/ingest
      # The address this instance claims: invite links, alert links and MCP
      # asset links all mint from it, and it is the origin the MCP endpoint
      # trusts. A host reachable at a real name overrides it in .env.
      BASE_URL: ${BASE_URL:-http://localhost:8001} # must match the port above
    volumes:
      - appdata:/data
      - ./ingest-root:/data/ingest
      - ./backups:/data/backups # daily DB archives — outlives `down -v`
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gallery}
      POSTGRES_DB: ${POSTGRES_DB:-gallery}
    volumes:
      - pgdata:/var/lib/postgresql/data

  extractor: # PDF/docx text + OCR
    image: ghcr.io/alexmicuplusfour/001az-extractor:latest
    build: ./extractor
    restart: unless-stopped

  # --- Optional AI engines: delete the leading "#" on a block to turn it on. ---
  # Heavy: each bakes its models into the image at build time. The app works
  # without them (the capability just reads "unavailable"). Every value shown
  # is the default already compiled in, so you can uncomment and change none.

#  transcriber: # speech-to-text + speaker diarization (whisper)
#    # The model IS the image tag: :small (+~1.2GB), :medium (+~2.2GB, ~3x
#    # slower, markedly better on real speech), or :small-medium (both baked,
#    # boards pick per-board). Other bakes: build transcriber/Dockerfile.
#    image: ghcr.io/alexmicuplusfour/001az-transcriber:small
#    restart: unless-stopped
#    environment:
#      WHISPER_LANGUAGE: ""      # "" auto-detects; or "en", "ro", "de"
#      WHISPER_BEAM: "5"         # 5 accurate, 1 fastest
#      WHISPER_DIARIZE: "1"      # "0" drops the S1/S2 speaker labels
#      WHISPER_DIARIZE_THRESHOLD: "0.8"  # lower splits voices, higher merges

#  object-detector: # open-vocabulary object detection (LLMDet), +~3GB
#    image: ghcr.io/alexmicuplusfour/001az-object-detector:latest
#    restart: unless-stopped
#    build:
#      context: ./object-detector
#      args:
#        OBJECT_DETECTOR_MODEL: iSEE-Laboratory/llmdet_tiny  # or llmdet_base

  caddy: # optional HTTPS. Put your domain below, then COMPOSE_PROFILES=edge
    image: caddy:2
    profiles: ["edge"]
    command: caddy reverse-proxy --from example.com --to app:3001
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:

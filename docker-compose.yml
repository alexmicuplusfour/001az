# Copy .env.example to .env — every setting is documented there.

name: 001az

services:
  app:
    image: ghcr.io/alexmicuplusfour/001az-app:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gallery}:${POSTGRES_PASSWORD:-gallery}@db:5432/${POSTGRES_DB:-gallery}
      INGEST_ROOT: /data/ingest
    volumes:
      - appdata:/data
      - ./ingest-root:/data/ingest
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gallery}
      POSTGRES_DB: ${POSTGRES_DB:-gallery}
    volumes:
      - pgdata:/var/lib/postgresql/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  extractor: # PDF/docx text + OCR
    image: ghcr.io/alexmicuplusfour/001az-extractor:latest
    build: ./extractor
    restart: unless-stopped

  # Optional on-device AI engines — enable with COMPOSE_PROFILES=transcribe,detect
  # in .env. Their models are baked into the image at build time.

  transcriber: # speech-to-text + speaker diarization (whisper)
    image: ghcr.io/alexmicuplusfour/001az-transcriber:latest
    profiles: ["transcribe"]
    build:
      context: ./transcriber
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
        BAKE_MODELS: ${BAKE_MODELS:-}
    restart: unless-stopped
    environment:
      WHISPER_BEAM: ${WHISPER_BEAM:-}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      WHISPER_DIARIZE: ${WHISPER_DIARIZE:-}
      WHISPER_DIARIZE_THRESHOLD: ${WHISPER_DIARIZE_THRESHOLD:-}

  object-detector: # open-vocabulary object detection (LLMDet)
    image: ghcr.io/alexmicuplusfour/001az-object-detector:latest
    profiles: ["detect"]
    build:
      context: ./object-detector
      args:
        OBJECT_DETECTOR_MODEL: ${OBJECT_DETECTOR_MODEL:-iSEE-Laboratory/llmdet_tiny}
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:

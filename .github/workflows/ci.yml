name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gallery
          POSTGRES_PASSWORD: gallery
          POSTGRES_DB: gallery
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gallery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The suite creates throwaway databases; point it at the service's
      # maintenance db (the gallery superuser can CREATE DATABASE).
      TEST_ADMIN_URL: postgres://gallery:gallery@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inspo-gallery .

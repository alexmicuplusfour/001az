name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gallery
          POSTGRES_PASSWORD: gallery
          POSTGRES_DB: gallery
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gallery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The suite creates throwaway databases; point it at the service's
      # maintenance db (the gallery superuser can CREATE DATABASE).
      TEST_ADMIN_URL: postgres://gallery:gallery@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser tests (test/browser/) drive a real Chromium. --with-deps
      # pulls the shared libraries the headless build needs on a bare runner;
      # chromium only, because that's the one they launch.
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # The PDF extractor's own tests (extractor/test_main.py). They need PyMuPDF
  # and Tesseract, which only exist in its image, so they run inside it with
  # the folder mounted over /app: the tests and main.py are this checkout's.
  # The build reads the Images workflow's layer cache, so an unchanged
  # Dockerfile costs a cache hit, not a rebuild.
  extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./extractor
          load: true
          tags: extractor-test
          cache-from: type=gha,scope=extractor
      - run: docker run --rm -v "$PWD/extractor:/app" extractor-test python -m unittest -v


# The build half of planning/prebuilt-images-plan.md. A push to main builds
# the images whose inputs changed since the last GREEN run (diffing against
# event.before would silently skip a cancelled/failed run's changes) and
# publishes latest + sha-<short> to GHCR. Unchanged images get this commit's
# sha tag stamped by manifest retag — so EVERY green run leaves all four
# images addressable at its commit, which is the tag the deploy pins.
# workflow_dispatch rebuilds everything.
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
      retag: ${{ steps.diff.outputs.retag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALL='app extractor transcriber object-detector'
          base=''
          if [ "${{ github.event_name }}" != workflow_dispatch ]; then
            base=$(gh run list --workflow Images --branch main --status success \
                     --limit 1 --json headSha --jq '.[0].headSha' || true)
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            build=$ALL
          else
            changed=$(git diff --name-only "$base" HEAD)
            hit() { echo "$changed" | grep -qE "$1"; }
            if hit '^\.github/workflows/images\.yml'; then
              build=$ALL
            else
              build=''
              # the app's inputs are what .dockerignore admits into its context
              hit '^(server/|public/|examples/|package(-lock)?\.json$|Dockerfile$|\.dockerignore$)' && build="$build app"
              hit '^extractor/' && build="$build extractor"
              hit '^transcriber/' && build="$build transcriber"
              hit '^object-detector/' && build="$build object-detector"
            fi
          fi
          retag=''
          for s in $ALL; do case " $build " in *" $s "*) ;; *) retag="$retag $s";; esac; done
          jsonify() { if [ -z "$(echo $1)" ]; then echo '[]'; else printf '%s\n' $1 | jq -R . | jq -cs .; fi; }
          echo "build=$(jsonify "$build")" >> "$GITHUB_OUTPUT"
          echo "retag=$(jsonify "$retag")" >> "$GITHUB_OUTPUT"
          echo "base=${base:-none} build=[$build ] retag=[$retag ]"

  build:
    needs: changes
    if: needs.changes.outputs.build != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/001az-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'app' && '.' || format('./{0}', matrix.image) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  retag:
    needs: [changes, build]
    if: always() && needs.changes.outputs.retag != '[]' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          NS: ghcr.io/${{ github.repository_owner }}
        run: |
          short=${GITHUB_SHA::7}
          for s in $(echo '${{ needs.changes.outputs.retag }}' | jq -r '.[]'); do
            docker buildx imagetools create -t "$NS/001az-$s:sha-$short" "$NS/001az-$s:latest"
          done

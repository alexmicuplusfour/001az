# The build half of planning/prebuilt-images-plan.md. A push to main builds
# the images whose inputs changed and publishes them to GHCR as latest +
# sha-<shortsha>; workflow_dispatch rebuilds everything (first run, upstream
# hiccups).
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ github.event_name == 'workflow_dispatch' && '["app","extractor","transcriber","object-detector"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # The app's inputs are what .dockerignore lets into its context;
          # each sidecar's input is its own directory. A workflow change
          # rebuilds everything.
          filters: |
            app:
              - 'server/**'
              - 'public/**'
              - 'examples/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/images.yml'
            extractor:
              - 'extractor/**'
              - '.github/workflows/images.yml'
            transcriber:
              - 'transcriber/**'
              - '.github/workflows/images.yml'
            object-detector:
              - 'object-detector/**'
              - '.github/workflows/images.yml'

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/001az-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'app' && '.' || format('./{0}', matrix.image) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

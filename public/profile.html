<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>001az - profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/toast.css" />
    <link rel="stylesheet" href="/panel.css" />
    <style>
      /* panel.css zeroes .panel .section for the admin tabs; this page stacks
         two sections in one panel, so the follow-ups get their spacing back */
      .panel .section + .section { margin-top: 40px; }
      #name-form { max-width: 420px; }
    </style>
  </head>
  <body>
    <div id="gate" class="gate">Checking access…</div>
    <div id="profile-ui" hidden>
      <div class="page-head">
        <h1>Profile</h1>
      </div>
      <div class="layout">
        <nav class="tabs">
          <button class="tab active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Account
          </button>
          <a class="tab-link" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            Gallery
          </a>
        </nav>
        <main class="panels">
          <section class="panel">
            <div class="section">
              <h2>Name</h2>
              <p class="sub">Shown with your hearts and anywhere members are listed.</p>
              <form id="name-form">
                <input id="name-input" maxlength="80" placeholder="Your name" autocomplete="name" />
                <button type="submit">Save</button>
              </form>
            </div>
            <div class="section">
              <h2>Password</h2>
              <p class="sub">Changing it signs you out everywhere else.</p>
              <a href="/login.html?change=1&amp;next=%2Fprofile.html">Change password</a>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="profile.js" type="module"></script>
  </body>
</html>

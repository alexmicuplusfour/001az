<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>001az</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="modal.css" />
    <link rel="stylesheet" href="toast.css" />
    <link rel="stylesheet" href="dropdown.css" />
    <link rel="stylesheet" href="checkbox.css" />
  </head>
  <body>
    <header>
      <!-- Row 1 sits in its own wrapper: that wrapper is the grid track the
           scroll collapse empties (header-scroll.js), and the row's spacing and
           dividing rule go down inside it. -->
      <div id="toolbar-fold"><div id="toolbar"></div></div>
      <div id="toolbar-sub"></div>
    </header>
    <div id="header-space" aria-hidden="true"></div>
    <div id="filters"></div>
    <main id="grid"></main>
    <div id="grid-sentinel" aria-hidden="true"></div>

    <input id="file-input" type="file" accept="image/*,.pdf,.docx,.txt,.md,.csv,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac" multiple hidden />
    <div id="drop-overlay" hidden><div class="drop-hint">Drop images, documents or audio to upload</div></div>

    <div id="lightbox" class="lightbox" tabindex="-1" hidden>
      <button id="lightbox-prev" class="lightbox-nav prev" aria-label="Previous"></button>
      <!-- The stage: detail renderers (detail-view.js) mount their own DOM here;
           nothing inside is fixed markup anymore. -->
      <div id="lightbox-stage" class="lightbox-stage"></div>
      <button id="lightbox-next" class="lightbox-nav next" aria-label="Next"></button>
      <div id="lightbox-controls" class="lightbox-controls">
        <button id="lightbox-crate" class="lightbox-action lightbox-crate" hidden></button>
        <button id="lightbox-fav" class="lightbox-action lightbox-fav" hidden></button>
        <button id="lightbox-info" class="lightbox-action lightbox-info" title="Details" aria-label="Details"></button>
      </div>
      <div id="lightbox-count" class="lightbox-count"></div>
      <aside id="lightbox-panel" class="lightbox-panel" hidden>
        <div class="lbp-head">
          <span>Details</span>
          <div class="lbp-head-actions">
            <a id="lightbox-download" class="lbp-download" title="Download" aria-label="Download"></a>
            <button id="lightbox-panel-close" class="lbp-close" aria-label="Close panel">×</button>
          </div>
        </div>
        <div id="lightbox-panel-body" class="lbp-body"></div>
      </aside>
    </div>

    <div id="filter-drawer" class="filter-drawer">
      <div class="filter-drawer-scrim" id="filter-drawer-scrim"></div>
      <div class="filter-drawer-panel">
        <div class="filter-drawer-head">
          <div class="filter-drawer-title-group">
            <span class="filter-drawer-title">Filters</span>
            <button id="filter-drawer-saved" class="filter-drawer-saved dd-caret" title="Filter options" aria-label="Filter options" hidden></button>
          </div>
          <div class="filter-drawer-actions">
            <button id="filter-drawer-clear" class="filter-drawer-clear" hidden>Clear filters</button>
            <button id="filter-drawer-close" class="filter-drawer-close">Done</button>
          </div>
        </div>
        <div id="filters-mobile"></div>
      </div>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>001az - welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/dropdown.css" />
    <link rel="stylesheet" href="/modal.css" />
    <link rel="stylesheet" href="/toast.css" />
    <link rel="stylesheet" href="/welcome.css" />
  </head>
  <body>
    <header hidden>
      <div id="toolbar-fold"><div id="toolbar"></div></div>
    </header>
    <div id="gate" class="gate">Checking access…</div>
    <main id="welcome" class="w-page" hidden>
      <h1 id="w-title">Connect an AI model</h1>
      <p id="w-why" class="w-why">Needed for tagging, descriptions and board fields.</p>

      <div id="w-tiles" class="w-tiles"></div>
      <div id="w-picked" class="w-picked" hidden></div>

      <p id="w-fine" class="w-fine">You can change this later.</p>

      <div id="w-next" class="w-next w-actions" hidden></div>

      <hr class="w-rule" />
      <button type="button" id="w-disclose" class="w-disclose" aria-expanded="false" aria-controls="w-others">
        <span>What else this server can do</span>
        <span id="w-disclose-marks" class="w-disclose-marks"></span>
        <span class="w-caret"></span>
      </button>
      <div id="w-others" class="w-others" hidden></div>

      <div class="w-foot">
        <button type="button" id="w-skip" class="w-link">Skip for now</button>
        <span>Uploads, boards and filtering work without it.</span>
      </div>
    </main>
    <script src="/welcome.js" type="module"></script>
  </body>
</html>
